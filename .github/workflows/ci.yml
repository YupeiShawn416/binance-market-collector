name: market-service
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-contracts-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.13'
      - run: uv sync --frozen --extra dev --extra kraken
      - run: make check test

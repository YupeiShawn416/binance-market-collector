[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shared-market-service"
version = "0.4.0"
description = "Durable Binance spot market events shared by decision and trading consumers"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = ["cryptofeed==3.0.2", "order-book==1.1.0", "msgspec==0.22.0", "aiohttp==3.14.5"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff>=0.14"]
kraken = ["python-kraken-sdk==3.5.1"]

[project.scripts]
market-service = "market_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.uv.sources]
cryptofeed = { path = "vendor/cryptofeed" }
order-book = { path = "vendor/orderbook" }

# Installed as /etc/binance-market-collector/collector.toml for the systemd unit.
config_version = 1
db = "/var/lib/binance-market-collector/btc.sqlite"
health = "/var/lib/binance-market-collector/health.json"
socket = "/run/binance-market-collector/feed.sock"
rest_base = "https://data-api.binance.vision"
ws_base = "wss://data-stream.binance.vision"
heartbeat_seconds = 5
stale_seconds = 10
retry_initial = 1
retry_max = 60
min_free_bytes = 2147483648
checkpoint_every = 250
